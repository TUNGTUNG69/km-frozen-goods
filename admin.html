<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Panel | KM's Frozen Goods</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<p class="gate-msg" id="gateMsg">Checking access...</p>

<div id="adminApp" hidden>
  <nav class="navbar-custom">
    <div class="wrap navbar-flex">
      <div class="brand-admin">KM's Frozen Goods - Admin</div>
      <div>
        <a class="admin-link" href="index.html">View Website</a>
        <span class="whoami" id="whoami"></span>
        <button class="btn-outline-light" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </nav>

  <div class="wrap admin-wrap">
    <div id="adminMsg" class="alert" style="display:none;" role="status"></div>

    <div class="stat-cards">
      <div class="stat-card"><span>Products</span><strong id="statProducts">0</strong></div>
      <div class="stat-card"><span>Pending Orders</span><strong id="statPending">0</strong></div>
      <div class="stat-card"><span>Total Orders</span><strong id="statOrders">0</strong></div>
      <div class="stat-card"><span>Registered Customers</span><strong id="statCustomers">0</strong></div>
    </div>

    <div class="admin-tabs" role="tablist">
      <button type="button" class="atab active" data-tab="products">Products</button>
      <button type="button" class="atab" data-tab="orders">Orders <span class="pill" id="pendingPill" style="display:none;">0</span></button>
      <button type="button" class="atab" data-tab="customers">Customers</button>
    </div>

    <!-- Products -->
    <section id="tab-products" class="tab-panel">
      <div class="admin-split">
        <div class="card">
          <div class="card-header" id="formTitle">Add Product</div>
          <div class="card-body">
            <form id="productForm" novalidate>
              <label for="pName">Name</label>
              <input class="form-control" id="pName" type="text" required>
              <label for="pCategory">Category</label>
              <input class="form-control" id="pCategory" type="text" list="catList" placeholder="Pick or type a new one" required>
              <datalist id="catList"></datalist>
              <label for="pSize">Size / Description</label>
              <input class="form-control" id="pSize" type="text" placeholder="e.g. 1 kg, 500 g, 10 pcs">
              <div class="two-col">
                <div><label for="pPrice">Price (PHP)</label><input class="form-control" id="pPrice" type="number" min="0" step="0.01" required></div>
                <div><label for="pQty">Stock</label><input class="form-control" id="pQty" type="number" min="0" step="1" value="0" required></div>
              </div>
              <label for="pImage">Picture file name (optional)</label>
              <input class="form-control" id="pImage" type="text" placeholder="e.g. kimchi.jpeg (inside the img folder)">
              <button class="btn btn-primary btn-block" id="saveBtn" type="submit">Save Product</button>
              <button class="btn btn-ghost btn-block" id="cancelEdit" type="button" style="display:none;margin-top:8px;">Cancel Edit</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">All Products</div>
          <div class="card-body">
            <input class="form-control" id="productFilter" type="search" placeholder="Search products or category" aria-label="Search products">
            <div class="table-scroll">
              <table>
                <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="productsBody"><tr><td colspan="5">Loading...</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Orders -->
    <section id="tab-orders" class="tab-panel" hidden>
      <div class="orders-bar">
        <label for="orderFilter">Show</label>
        <select class="form-control" id="orderFilter">
          <option value="all">All orders</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="ordersList"><p class="empty-msg">Loading...</p></div>
    </section>

    <!-- Customers -->
    <section id="tab-customers" class="tab-panel" hidden>
      <div class="card">
        <div class="card-header">Registered Customers</div>
        <div class="card-body table-scroll">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
            <tbody id="customersBody"><tr><td colspan="3">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="catalog.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
